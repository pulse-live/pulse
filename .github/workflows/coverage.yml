---
name: Coverage

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Commit to check out; defaults to the triggering commit
        required: false
        type: string
        default: ''
    secrets:
      CODECOV_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  coverage:
    name: All-feature coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: always
      # Only the upload step receives the token. Forks still generate a report.
      CODECOV_ENABLED: ${{ secrets.CODECOV_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # stable
        with:
          components: llvm-tools-preview
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25  # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git/db
            target/llvm-cov-target
          key: ${{ runner.os }}-${{ runner.arch }}-coverage-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b  # v2
        with:
          tool: cargo-llvm-cov@0.9.1
          fallback: none
      - name: Generate LCOV report
        run: cargo llvm-cov --all-features --locked --lcov --output-path lcov.info
      - name: Upload coverage artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: pulse-coverage
          path: lcov.info
          if-no-files-found: error
          retention-days: 14
      - name: Upload to Codecov when configured
        if: env.CODECOV_ENABLED == 'true'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v6
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: lcov.info
          disable_search: true
          flags: rust
          fail_ci_if_error: false
