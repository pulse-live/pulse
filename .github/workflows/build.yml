---
name: Build

# Test & Build: runs on every push to the flow's branches and on pull requests. `CI OK`
# is the one check branch protection and the release guard look at.
on:
  pull_request:
  push:
    branches:
      - main
      - develop
      - sandbox
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: '5'

jobs:
  test:
    uses: ./.github/workflows/test.yml

  coverage:
    uses: ./.github/workflows/coverage.yml
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  audit:
    uses: ./.github/workflows/security-audit.yml

  # Builds and packages every release file, so a packaging problem fails on sandbox and
  # develop, before a release. The release builds the same way (same action).
  build:
    name: ${{ matrix.platform.target }} / ${{ matrix.feature-set }}
    needs: [test, audit]
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
        feature-set: [default, telemetry]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/build-package
        with:
          target: ${{ matrix.platform.target }}
          feature-set: ${{ matrix.feature-set }}
      - name: Upload release artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: pulse-binary-${{ matrix.platform.target }}-${{ matrix.feature-set }}
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14

  # The one required check. Coverage is reported but does not gate a merge or a release.
  ci-ok:
    name: CI OK
    if: always()
    needs:
      - test
      - audit
      - build
    runs-on: ubuntu-24.04
    steps:
      - name: Require every job to have succeeded
        shell: bash
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: ${RESULTS}"
          for result in ${RESULTS}; do
            if [[ "${result}" != "success" ]]; then
              echo "::error::A required job finished with '${result}'."
              exit 1
            fi
          done
