---
name: Build

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Commit to check out; defaults to the triggering commit
        required: false
        type: string
        default: ''
    secrets:
      CODECOV_TOKEN:
        required: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: '5'

jobs:
  test:
    uses: ./.github/workflows/test.yml
    with:
      ref: ${{ inputs.ref || github.sha }}

  coverage:
    uses: ./.github/workflows/coverage.yml
    with:
      ref: ${{ inputs.ref || github.sha }}
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  audit:
    uses: ./.github/workflows/security-audit.yml
    with:
      ref: ${{ inputs.ref || github.sha }}

  build:
    name: ${{ matrix.platform.target }} / ${{ matrix.feature-set }}
    needs: [test, audit]
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
        feature-set: [default, telemetry]
    env:
      PULSE_TARGET: ${{ matrix.platform.target }}
      PULSE_FEATURE_SET: ${{ matrix.feature-set }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # stable
        with:
          targets: ${{ matrix.platform.target }}
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25  # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-${{ runner.arch }}-build-${{ matrix.platform.target }}-${{ matrix.feature-set }}-${{ hashFiles('Cargo.lock') }}
      - name: Install native build and package tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends musl-tools binutils rpm dpkg-dev liblzma-dev pkg-config
      - name: Install pinned Rust packagers
        run: |
          cargo install cargo-deb --version 3.8.0 --locked
          cargo install cargo-generate-rpm --version 0.21.1 --locked
      - name: Build release binary
        shell: bash
        run: |
          set -euo pipefail
          features=()
          if [[ "$PULSE_FEATURE_SET" == telemetry ]]; then
            features=(--features telemetry)
          fi
          cargo build --release --locked --no-default-features --target "$PULSE_TARGET" "${features[@]}"
      - name: Smoke-test native artifact
        shell: bash
        run: |
          set -euo pipefail
          binary="target/$PULSE_TARGET/release/pulse"
          "$binary" --help > /dev/null
          "$binary" -V
          "$binary" --version
          "$binary" config validate --file examples/pulse.toml
          "$binary" config validate --file examples/managed-edge.toml
      - name: Package and validate tar, DEB and RPM artifacts
        shell: bash
        run: bash scripts/package-release.sh "$PULSE_TARGET" "$PULSE_FEATURE_SET"
      - name: Upload release artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: pulse-binary-${{ matrix.platform.target }}-${{ matrix.feature-set }}
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14
